name: Build and push release

on:
  release:
    types: [published]

permissions:
  contents: read
  packages: write

concurrency:
  group: build-release-${{ github.event.release.tag_name }}
  cancel-in-progress: true

jobs:
  buildandpush:
    if: ${{ github.event.release.prerelease == false }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - platform: linux/amd64
            arch: amd64
            runner: ubuntu-24.04
          - platform: linux/arm64
            arch: arm64
            runner: ubuntu-24.04-arm
    runs-on: ${{ matrix.runner }}
    name: Build and push ${{ matrix.platform }}
    steps:
      - name: Checkout release
        uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6
        # https://github.com/actions/checkout/releases/tag/v6.0.2
        with:
          persist-credentials: false
          ref: ${{ github.event.release.tag_name }}

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@4d04d5d9486b7bd6fa91e7baf45bbb4f8b9deedd # v4
        # https://github.com/docker/setup-buildx-action/releases/tag/v4.0.0

      - name: Login to GitHub Container Registry
        uses: docker/login-action@4907a6ddec9925e35a0a9e82d7399ccc52663121 # v4
        # https://github.com/docker/login-action/tree/v4.1.0
        with:
          registry: ghcr.io
          username: ${{ github.repository_owner }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Build release for ${{ matrix.platform }} and push to GHCR.io
        uses: docker/build-push-action@d08e5c354a6adb9ed34480a06d141179aa583294 # v7
        id: push
        with:
          platforms: ${{ matrix.platform }}
          build-args: |
            VERSION=${{ github.event.release.tag_name }}
          cache-from: type=gha,scope=${{ runner.os }}-${{ matrix.arch }}
          cache-to: type=gha,mode=max,scope=${{ runner.os }}-${{ matrix.arch }}
          outputs: type=image,name=ghcr.io/deltablot/partage,push-by-digest=true,name-canonical=true,push=true
          sbom: true
          provenance: mode=max

      - name: Export image digest
        run: |
          mkdir -p /tmp/digests
          digest="${{ steps.push.outputs.digest }}"
          touch "/tmp/digests/${digest#sha256:}"

      - name: Upload image digest
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: digests-${{ matrix.arch }}
          path: /tmp/digests/*
          if-no-files-found: error
          retention-days: 1

  merge:
    name: Merge and push multi-platform release image
    runs-on: ubuntu-24.04
    needs: buildandpush
    steps:
      - name: Download image digests
        uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8.0.1
        with:
          path: /tmp/digests
          pattern: digests-*
          merge-multiple: true

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@4d04d5d9486b7bd6fa91e7baf45bbb4f8b9deedd # v4
        # https://github.com/docker/setup-buildx-action/releases/tag/v4.0.0

      - name: Login to GitHub Container Registry
        uses: docker/login-action@4907a6ddec9925e35a0a9e82d7399ccc52663121 # v4
        # https://github.com/docker/login-action/tree/v4.1.0
        with:
          registry: ghcr.io
          username: ${{ github.repository_owner }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Create manifest list and push
        working-directory: /tmp/digests
        run: |
          set -euo pipefail
          image="ghcr.io/deltablot/partage"
          tag="${{ github.event.release.tag_name }}"
          refs=()
          for digest_file in *; do
            refs+=("${image}@sha256:${digest_file}")
          done
          docker buildx imagetools create \
            --tag "${image}:${tag}" \
            "${refs[@]}"
